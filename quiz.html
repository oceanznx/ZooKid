<!DOCTYPE html>
<html lang="pt-Br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZooKid - Quiz Animais</title>
    <link rel="stylesheet" href="home.css">
    <link rel="stylesheet" href="quiz.css">
    <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css" />
</head>

<style>
    header {
        justify-content: space-between;
    }
</style>
<body>
    <header data-aos="fade-down" data-aos-duration="1500">
        <h1 class="title">ZOO<span>KID</span></h1>

        <nav>
            <a href="index.html">VOLTAR</a>
           
        </nav>
    </header>
    
    <main>
        <section  data-aos="zoom-in" data-aos-duration="2000" data-aos-delay="300"class="banner">
            <h2 data-aos-delay="700" data-aos="fade-down" data-aos-duration="2000">QUIZ DOS SONS ANIMAIS</h2>
            <p data-aos-delay="700" data-aos="fade-down" data-aos-duration="2500">DESCUBRA QUAL ANIMAL FEZ ESSE SOM!</p>
            
            <h3 id="feedback-message" class="feedback-message"></h3>
            
            <div class="quiz-container">
                <div data-aos="fade-left" data-aos-duration="3000" data-aos-delay="600" class="score-board">
                    PONTUAÇÃO: <span id="score">0</span> | ACERTOS: <span id="correct-count">0</span>
                </div>

                <div class="controls-container">
                    <button data-aos="fade-right" data-aos-duration="3000" data-aos-delay="600" id="play-sound-btn" class="sound-button">
                        🔊 TOCAR SOM
                    </button>
                    <button data-aos="fade-left" data-aos-duration="3000" data-aos-delay="600" id="next-question-btn" class="next-button" style="display:none;">
                        PRÓXIMA PERGUNTA ▶
                    </button>
                </div>
                
                <div data-aos="zoom-in" data-aos-duration="3000" data-aos-delay="600" class="options-container" id="options-container">
                    
                    <div class="animal-option" data-animal="waiting">
                        <img class="pictures" src="placeholder-1.jpg" alt="Animal 1">
                        <p>Animal 1</p>
                    </div>

                    <div class="animal-option" data-animal="waiting">
                        <img class="pictures" src="placeholder-2.jpg" alt="Animal 2">
                        <p>Animal 2</p>
                    </div>

                    <div class="animal-option" data-animal="waiting">
                        <img class="pictures" src="placeholder-3.jpg" alt="Animal 3">
                        <p>Animal 3</p>
                    </div>

                </div>
            </div>
        </section>
    </main>

    <script src="quiz.js"></script>
    <script src="https://unpkg.com/aos@next/dist/aos.js"></script>
  <script>
    AOS.init();
  </script>
</body>
</html>
